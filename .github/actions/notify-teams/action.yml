name: Notify Teams Channel
description: Sends an AdaptiveCard message to a Teams channel

inputs:
  webhook_uri:
    description: The Teams webhook URI to send the message to
    required: true
  title:
    description: The message title
    required: true
  body:
    description: The message body
    required: false
  action_text:
    description: The text for a clickable link action on the message card. Requires `action_url` to also be provided.
    required: false
  action_url:
    description: The URL for the clickable link action on the message card. Requires `action_text` to also be provided.
    required: false

runs:
  using: composite
  steps:
    - name: "Send Teams message"
      uses: actions/github-script@v9
      env:
        WEBHOOK_URI: ${{ inputs.webhook_uri }}
        MESSAGE_TITLE: ${{ inputs.title }}
        MESSAGE_BODY: ${{ inputs.body }}
        ACTION_TEXT: ${{ inputs.action_text }}
        ACTION_URL: ${{ inputs.action_url }}
      with:
        script: |
          const { run } = require('${{ github.action_path }}/run.ts')
          await run(core)

